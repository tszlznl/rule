# 必读！！！
# 理论上较完美的精确分流版本+DNS防泄露
# 供爱折腾的朋友参考，新手使用可能更容易遇到问题。
rule-anchor:
  # 订阅
  P: &P {type: http, interval: 0, health-check: {enable: true, url: "https://clients1.google.com/generate_204", interval: 3600}, exclude-filter: "官网|剩余|流量|套餐|免费|订阅|到期时间|GB|Expire Date|Traffic|ExpireDate", proxy: 直连}
  # 节点选择
  G1: &G1 {type: select, proxies: [默认代理, AI, YouTube, Google, GitHub, Telegram, TikTok, NETFLIX, Wallet, Steam, Microsoft, OneDrive, Apple, 漏网之鱼, 日本手动, 狮城手动, 香港手动, 美国手动, 手动选择, 自动选择, 延迟辅助]}
  S1: &S1 {type: select, proxies: [日本手动, 狮城手动, 香港手动, 美国手动, 手动选择, 自动选择]}
  S2: &S2 {type: select, proxies: [直连, 日本手动, 狮城手动, 香港手动, 美国手动, 手动选择, 自动选择]}
  S3: &S3 {type: select, proxies: [默认代理, 日本手动, 狮城手动, 香港手动, 美国手动, 手动选择, 自动选择, 直连]}
  S4: &S4 {type: url-test, proxies: [直连, DIRECT], interval: 3600, lazy: true, url: "http://connect.rom.miui.com/generate_204"}
  # 节点筛选
  HK: &HK "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美|ZJ)).)*$"
  JP: &JP "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美|ZJ)).)*$"
  SG: &SG "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$"
  US: &US "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新|AUS|RUS|ZJ)).)*$"
  Exclude: &Exclude "^((?!(直连)).)*$"
  # 策略组
  SD: &SD {type: select, include-all: true}
  URL: &URL {type: url-test, include-all: true, tolerance: 50, interval: 3600, lazy: true, url: "https://clients1.google.com/generate_204"}
  # 规则集
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

proxy-providers:
  HH: {<<: *P, url: "订阅链接url"}

proxies:
  - {name: 直连, type: direct, udp: true}

mixed-port: 7890
authentication:
- "user:passwd"
skip-auth-prefixes:
- 127.0.0.0/8
- 192.168.0.0/16
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: "passwd"
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

geo-auto-update: true
geo-update-interval: 48
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

ntp:
  enable: true
  write-to-system: true

tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - cn_ip

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#默认代理&ecs=223.5.5.0/24&ecs-override=true&disable-qtype-65=true
  fallback:
    - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  fallback-lazy-query: true
  fallback-filter:
    geoip: true
    geoip-code: CN
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn":
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    "rule-set:fakeipfilter_!cn":
    - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain

proxy-groups:
