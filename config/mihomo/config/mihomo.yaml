  - {name: 日本手动, <<: *SD, filter: *JP, icon: "https://raw.githubusercontent.com/qichiyuhub/mofish-icon/refs/heads/main/mihomo/flag/corner/japan.png"}
  - {name: 狮城手动, <<: *SD, filter: *SG, icon: "https://raw.githubusercontent.com/qichiyuhub/mofish-icon/refs/heads/main/mihomo/flag/corner/singapore.png"}
  - {name: 香港手动, <<: *SD, filter: *HK, icon: "https://raw.githubusercontent.com/qichiyuhub/mofish-icon/refs/heads/main/mihomo/flag/corner/hongkong.png"}
  - {name: 美国手动, <<: *SD, filter: *US, icon: "https://raw.githubusercontent.com/qichiyuhub/mofish-icon/refs/heads/main/mihomo/flag/corner/usa.png"}
  - {name: 手动选择, <<: *SD, filter: *Exclude, icon: "https://raw.githubusercontent.com/qichiyuhub/mofish-icon/refs/heads/main/mihomo/pure/corner/all.png"}
  - {name: 自动选择, <<: *URL, filter: *Exclude, icon: "https://raw.githubusercontent.com/qichiyuhub/mofish-icon/refs/heads/main/mihomo/pure/corner/auto.png"}
  - {name: 延迟辅助, <<: *S4, icon: "https://raw.githubusercontent.com/qichiyuhub/mofish-icon/refs/heads/main/mihomo/pure/corner/auto.png"}
  - {name: GLOBAL, <<: *G1, icon: "https://raw.githubusercontent.com/qichiyuhub/mofish-icon/refs/heads/main/mihomo/pure/corner/all.png"}

